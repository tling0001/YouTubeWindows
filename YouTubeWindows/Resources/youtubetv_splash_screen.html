    /* spinningContainer spins its children when active. */
    #spinningContainer {
      position: fixed;
      top: 71.5%;
      left: 50%;
      width: 166px;
      height: 166px;
      opacity: .2;
      margin: 0 0 0 -83px;
      display: none;
    }

    #spinningContainer.active {
      display: block;
      animation: spinning 5s linear infinite;
    }

    /* circle is a grey circle in spinningContainer. */
    #circle {
      border-radius: 50%;
      color: #ffffff;
      position: relative;
      width: 166px;
      height: 166px;
      box-shadow: inset 0 0 0 15px;
    }

    /* occludingRectangle is a rectangle that occludes part of the circle. */
    .occludingRectangle {
      background-color: #282828;
      position: absolute;
      top: -1px;
      width: 84px;
      height: 169px;
    }

    /* firstRectangle is an occludingRectangle that starts spinning first. */
    #firstRectangle {
      left: 83px;
      transform-origin: 0 83px;
      animation: spinning 1000ms /* static image only time*/ cubic-bezier(0.4, 0.0, 0.2, 1) infinite 1833ms;
    }

    /* secondRectangle is an occludingRectangle that starts spinning second. */
    #secondRectangle {
      left: -1px;
      transform-origin: 83px 83px;
      animation: spinning 1000ms /* static image only time*/ cubic-bezier(0.4, 0.0, 0.2, 1) infinite 2583ms;
    }

    @keyframes spinning {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /* Scale circle for resolutions like 1440p with 1921px <= width <= 2560px. */
    @media only screen and (min-device-width: 1921px) and (max-device-width: 2560px) {
      #circle {
        transform: scale(0.6666, 0.66666);
      }
    }

    /* Scale circle for resolutions like 1080p with 1281px <= width <= 1920px. */
    @media only screen and (min-device-width : 1281px) and (max-device-width : 1920px) {
      #circle {
        transform: scale(0.5, 0.5);
      }
    }

    /* Scale circle for resolutions like 720p with 769px <= width <= 1280px. */
    @media only screen and (min-device-width : 769px) and (max-device-width : 1280px) {
      #circle {
        transform: scale(0.33, 0.33);
      }
    }

    /* Scale & shift circle for resolutions like 640x480, 768x576, 720x576 with width <= 768px. */
    @media only screen and (max-device-width : 768px) {
      #spinningContainer.active {
        position: absolute;
        top: 55vh;
        animation: spinning 5s linear infinite;
      }

      #circle {
        transform: scale(0.1875, 0.1875);
      }
    }

  </div>
</div>
